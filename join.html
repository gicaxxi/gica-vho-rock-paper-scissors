<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join the Final Boss Battle | Gica & Vho</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.screen {
  width: 100%;
  max-width: 1200px;
  min-height: 650px;
  background: #fffdf8;
  border: 2px solid #c39a4b;
  text-align: center;
  padding: 45px;
}

.brand {
  color: #7a2038;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 5px;
}

h1 {
  margin: 15px 0 5px;
  font-size: clamp(38px, 5vw, 62px);
}

.subtitle {
  color: #b58a39;
  font-weight: bold;
  letter-spacing: 4px;
  margin-bottom: 35px;
}

.players {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 45px;
}

.player {
  width: 320px;
  padding: 25px;
  border: 2px solid #c39a4b;
  background: #f7f1e5;
}

.role {
  color: #7a2038;
  font-weight: bold;
  letter-spacing: 2px;
  font-size: 15px;
}

.name {
  margin: 7px 0 18px;
  font-size: 24px;
  font-weight: bold;
}

.qr {
  width: 210px;
  height: 210px;
  margin: auto;
  padding: 10px;
  background: white;
  border: 1px solid #c39a4b;
}

.qr img {
  width: 100%;
  height: 100%;
}

.scan {
  margin-top: 15px;
  font-weight: bold;
  font-size: 13px;
  letter-spacing: 1px;
}

.vs {
  color: #b58a39;
  font-size: 28px;
  font-weight: bold;
}

.footer {
  margin-top: 35px;
  color: #755e38;
  font-size: 14px;
  letter-spacing: 2px;
}

@media(max-width: 750px) {
  .players {
    flex-direction: column;
  }

  .screen {
    padding: 30px 15px;
  }

  .vs {
    margin: -10px 0;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="brand">
    GICA & VHO
  </div>

  <h1>
    JOIN THE BATTLE
  </h1>

  <div class="subtitle">
    FINAL BOSS CHALLENGE
  </div>

  <div class="players">

    <div class="player">

      <div class="role">
        🏆 CHAMPION
      </div>

      <div class="name">
        PLAYER
      </div>

      <div class="qr">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Fgicaxxi.github.io%2Fgica-vho-rock-paper-scissors%2Fplayer1.html"
          alt="Champion QR Code">
      </div>

      <div class="scan">
        SCAN TO JOIN
      </div>

    </div>

    <div class="vs">
      VS
    </div>

    <div class="player">

      <div class="role">
        👑 FINAL BOSS
      </div>

      <div class="name">
        GICA & VHO
      </div>

      <div class="qr">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Fgicaxxi.github.io%2Fgica-vho-rock-paper-scissors%2Fplayer2.html"
          alt="Final Boss QR Code">
      </div>

      <div class="scan">
        SCAN TO JOIN
      </div>

    </div>

  </div>

  <div class="footer">
    SCAN YOUR SIDE'S QR CODE TO ENTER THE ARENA
  </div>

</div>

</body>
</html>
