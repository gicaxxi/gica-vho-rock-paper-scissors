<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Champion Registration | Gica & Vho</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.registration-card {
  width: 100%;
  max-width: 520px;
  padding: 38px 30px;
  border: 2px solid #c39a4b;
  background: #fffdf8;
  text-align: center;
  box-shadow: 10px 10px 0 rgba(20, 33, 58, .08);
}

.brand {
  color: #7a2038;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 5px;
}

h1 {
  margin: 18px 0 8px;
  color: #14213a;
  font-size: clamp(30px, 8vw, 44px);
}

.subtitle {
  margin-bottom: 28px;
  color: #b58a39;
  font-weight: bold;
  letter-spacing: 3px;
}

label {
  display: block;
  margin: 18px 0 8px;
  color: #7a2038;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
  text-align: left;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #c39a4b;
  background: white;
  color: #14213a;
  font: inherit;
  font-size: 18px;
}

input:focus {
  outline: 3px solid rgba(181, 138, 57, .24);
  border-color: #7a2038;
}

button,
.arena-link {
  width: 100%;
  margin-top: 26px;
  padding: 17px;
  border: 0;
  background: #14213a;
  color: white;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
}

button:hover,
.arena-link:hover {
  background: #7a2038;
}

button:disabled {
  cursor: wait;
  opacity: .65;
}

#formMessage {
  min-height: 24px;
  margin-top: 16px;
  color: #7a2038;
  font-weight: bold;
}

#successState { display: none; }

.success-mark {
  margin: 22px 0 14px;
  color: #7a2038;
  font-size: 52px;
}

.success-name {
  color: #7a2038;
  font-size: 32px;
  font-weight: bold;
}

.success-table {
  margin-top: 10px;
  color: #b58a39;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;
}

.success-copy {
  margin-top: 18px;
  line-height: 1.5;
}

.arena-link {
  display: block;
  text-decoration: none;
}
</style>
</head>

<body>

<main class="registration-card">

  <div class="brand">GICA & VHO</div>

  <section id="formState">
    <h1>🏆 FINAL CHAMPION</h1>
    <div class="subtitle">REGISTER TO CONTINUE</div>

    <form id="championForm">
      <label for="championName">CHAMPION NAME</label>
      <input
        id="championName"
        name="championName"
        type="text"
        maxlength="40"
        autocomplete="name"
        required>

      <label for="tableNumber">TABLE NUMBER</label>
      <input
        id="tableNumber"
        name="tableNumber"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        required>

      <button id="registerButton" type="submit">
        REGISTER CHAMPION
      </button>

      <div id="formMessage" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="successState" aria-live="polite">
    <div class="success-mark">✓</div>
    <h1>CHAMPION REGISTERED</h1>
    <div id="successName" class="success-name"></div>
    <div id="successTable" class="success-table"></div>
    <div class="success-copy">Your place in the Final Boss battle is confirmed.</div>

    <a class="arena-link" href="player1.html">
      ENTER THE ARENA
    </a>
  </section>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  update
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",
  authDomain: "gica-vho-wedding-game.firebaseapp.com",
  databaseURL: "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gica-vho-wedding-game",
  storageBucket: "gica-vho-wedding-game.firebasestorage.app",
  messagingSenderId: "544288400742",
  appId: "1:544288400742:web:c26d421bb4486a4e1814a7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const championForm =
  document.getElementById("championForm");

const registerButton =
  document.getElementById("registerButton");

const formMessage =
  document.getElementById("formMessage");

championForm.addEventListener("submit", async event => {

  event.preventDefault();

  const name =
    document.getElementById("championName").value.trim();

  const table =
    Number(document.getElementById("tableNumber").value);

  if (!name || !Number.isInteger(table) || table < 1) {

    formMessage.textContent =
      "Enter your name and a valid table number.";

    return;
  }

  registerButton.disabled = true;
  registerButton.textContent = "REGISTERING...";
  formMessage.textContent = "";

  try {

    await update(
      ref(db, "game/champion"),
      {
        name,
        table,
        registered: true
      }
    );

    document.getElementById(
      "successName"
    ).textContent = name.toUpperCase();

    document.getElementById(
      "successTable"
    ).textContent = "TABLE " + table;

    document.getElementById(
      "formState"
    ).style.display = "none";

    document.getElementById(
      "successState"
    ).style.display = "block";

  } catch (error) {

    registerButton.disabled = false;
    registerButton.textContent = "REGISTER CHAMPION";
    formMessage.textContent =
      "Registration failed. Please try again.";
  }
});

</script>

</body>
</html>
