<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Player 1 | Gica & Vho</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  padding:
    max(14px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

.controller {
  width: 100%;
  max-width: 480px;
  margin: auto;
  text-align: center;
  display: flex;
  flex-direction: column;
}

.brand {
  color: #7a2038;
  font-weight: bold;
  letter-spacing: 4px;
  margin-top: 4px;
  font-size: 14px;
}

h1 {
  margin: 8px 0 3px;
  font-size: clamp(26px, 8vw, 34px);
}

.player {
  color: #b58a39;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 12px;
  font-size: 14px;
}

.instruction {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 10px;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(6px, 2vw, 10px);
}

.choice {
  width: 100%;
  min-width: 0;
  min-height: clamp(72px, 11dvh, 86px);
  margin: 0;
  border: 2px solid #c39a4b;
  background: #fffdf8;
  color: #14213a;
  padding: 8px 4px;
  font-size: clamp(14px, 4vw, 17px);
  font-weight: bold;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 8px;
  touch-action: manipulation;
}

.choice.selected {
  background: #7a2038;
  color: white;
}

.choice:disabled {
  cursor: not-allowed;
  opacity: .52;
}

.emoji {
  font-size: clamp(30px, 9vw, 36px);
  line-height: 1;
}

#selection {
  min-height: 24px;
  margin-top: 12px;
  font-weight: bold;
  color: #7a2038;
  font-size: 14px;
}

#lockButton {
  width: 100%;
  min-height: 60px;
  margin-top: 10px;
  padding: 14px 18px;
  border: none;
  background: #14213a;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  touch-action: manipulation;
}

#lockButton:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#status {
  margin: 0 0 12px;
  padding: 11px 12px;
  border: 1px solid #c39a4b;
  font-weight: bold;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 14px;
}

.waiting {
  color: #7a2038;
}

.ready {
  background: #14213a;
  color: white;
}

.footer {
  margin-top: 18px;
  color: #9b7a39;
  font-size: 12px;
  letter-spacing: 2px;
}

@media (min-width: 600px) {
  body { padding-top: 24px; }
  .choice { min-height: 86px; }
}

@media (max-height: 700px) {
  body {
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .brand { margin-top: 0; font-size: 12px; }
  h1 { margin-top: 4px; font-size: 24px; }
  .player { margin-bottom: 7px; }
  #status { min-height: 40px; margin-bottom: 8px; padding: 8px; }
  .instruction { margin-bottom: 7px; font-size: 13px; }
  .choice { min-height: 68px; }
  #selection { margin-top: 8px; }
  #lockButton { min-height: 52px; margin-top: 6px; }
  .footer { display: none; }
}
</style>
</head>

<body>

<div class="controller">

  <div class="brand">GICA & VHO</div>

  <h1>MAKE YOUR MOVE</h1>

  <div class="player">CHAMPION</div>

  <div id="status" class="waiting">
    WAITING FOR FINAL BATTLE
  </div>

  <div class="instruction">
    Choose your move, then lock it in.
  </div>

  <div class="choice-grid">
  <button class="choice" data-choice="rock" disabled>
    <span class="emoji">✊</span>
    ROCK
  </button>

  <button class="choice" data-choice="paper" disabled>
    <span class="emoji">✋</span>
    PAPER
  </button>

  <button class="choice" data-choice="scissors" disabled>
    <span class="emoji">✌️</span>
    SCISSORS
  </button>
  </div>

  <div id="selection">
    NO MOVE SELECTED
  </div>

  <button id="lockButton" disabled>
    LOCK MY MOVE
  </button>

  <div class="footer">
    THE WEDDING GAME • GICA & VHO
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  onValue,
  onDisconnect,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",
  authDomain: "gica-vho-wedding-game.firebaseapp.com",
  databaseURL: "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gica-vho-wedding-game",
  storageBucket: "gica-vho-wedding-game.firebasestorage.app",
  messagingSenderId: "544288400742",
  appId: "1:544288400742:web:c26d421bb4486a4e1814a7"
};

let app;
let db;

try {
  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch (error) {
  console.error("Firebase initialization failed on Champion controller:", error);
  throw error;
}

const playerConnectionRef =
  ref(db, "game/player1/connected");

onDisconnect(playerConnectionRef)
  .set(false)
  .then(() => set(playerConnectionRef, true))
  .catch(error => {
    console.error("Champion presence initialization failed:", error);
  });
  let currentRound = null;
let currentResetVersion = null;

let selectedChoice = null;
let locked = false;
let lockPending = false;
let battleActive = false;
let consequenceActive = false;
let savedBattleChoice = null;

const buttons = document.querySelectorAll(".choice");
const lockButton = document.getElementById("lockButton");
const selection = document.getElementById("selection");
const status = document.getElementById("status");

function resetController() {

  selectedChoice = null;
  savedBattleChoice = null;
  locked = false;
  lockPending = false;

  const controlsActive =
    battleActive || consequenceActive;

  buttons.forEach(button => {
    button.disabled = !controlsActive;
    button.classList.remove("selected");
  });

  lockButton.disabled = true;
  lockButton.textContent = consequenceActive
    ? "LOCK MY CHOICE"
    : "LOCK MY MOVE";

  selection.textContent = consequenceActive
    ? "NO CHOICE SELECTED"
    : "NO MOVE SELECTED";

  status.textContent = consequenceActive
    ? "CHOOSE YOUR FATE"
    : battleActive
      ? "WAITING FOR YOUR MOVE"
      : "WAITING FOR FINAL BATTLE";
  status.className = "waiting";
}

function restoreBattleChoice() {
  if (!battleActive || !savedBattleChoice) return false;

  selectedChoice = savedBattleChoice;
  locked = true;
  buttons.forEach(button => {
    button.disabled = true;
    button.classList.toggle(
      "selected",
      button.dataset.choice === selectedChoice
    );
  });
  lockButton.disabled = true;
  lockButton.textContent = "MOVE LOCKED ✓";
  selection.textContent = "FINAL MOVE: " + selectedChoice.toUpperCase();
  status.textContent = "WAITING FOR PLAYER 2...";
  status.className = "ready";
  return true;
}

function restoreConsequenceChoice(consequenceData) {
  if (!consequenceActive) return false;

  if (consequenceData?.locked !== true) {
    if (locked) resetController();
    return false;
  }

  selectedChoice = consequenceData.choice || null;
  locked = true;
  lockPending = false;

  buttons.forEach(button => {
    button.disabled = true;
    button.classList.toggle(
      "selected",
      button.dataset.choice === selectedChoice
    );
  });

  lockButton.disabled = true;
  lockButton.textContent = "CHOICE LOCKED ✓";
  selection.textContent = selectedChoice
    ? "FATE CHOSEN: " + selectedChoice.toUpperCase()
    : "FATE CHOSEN";
  status.textContent = "FATE SEALED";
  status.className = "ready";
  return true;
}

onValue(ref(db, "game/phase"), snapshot => {

  const phase = snapshot.val() || "idle";
  const enteringConsequence =
    phase === "consequence" && !consequenceActive;

  battleActive = phase === "battle";
  consequenceActive = phase === "consequence";

  if (battleActive && restoreBattleChoice()) return;

  if (enteringConsequence) {
    resetController();
    get(ref(db, "game/consequence"))
      .then(consequenceSnapshot => {
        restoreConsequenceChoice(consequenceSnapshot.val() || {});
      })
      .catch(error => {
        console.error("Consequence restoration read failed:", error);
      });
    return;
  }

  if (!battleActive && !consequenceActive) {

    buttons.forEach(button => {
      button.disabled = true;
    });

    lockButton.disabled = true;
    status.textContent = "WAITING FOR FINAL BATTLE";
    status.className = "waiting";

  } else if (!locked) {

    buttons.forEach(button => {
      button.disabled = false;
    });

    lockButton.disabled = !selectedChoice;
    lockButton.textContent = consequenceActive
      ? "LOCK MY CHOICE"
      : "LOCK MY MOVE";
    status.textContent = consequenceActive
      ? "CHOOSE YOUR FATE"
      : "WAITING FOR YOUR MOVE";
    status.className = "waiting";
  }
});
  
buttons.forEach(button => {
  button.addEventListener("click", () => {

    if ((!battleActive && !consequenceActive) || locked || lockPending) return;

    selectedChoice = button.dataset.choice;

    buttons.forEach(btn =>
      btn.classList.remove("selected")
    );

    button.classList.add("selected");

    selection.textContent = consequenceActive
      ? "MYSTERY CHOICE: " + selectedChoice.toUpperCase()
      : "SELECTED: " + selectedChoice.toUpperCase();

    lockButton.disabled = false;
  });
});

lockButton.addEventListener("click", async () => {

  if (
    (!battleActive && !consequenceActive) ||
    !selectedChoice ||
    locked ||
    lockPending
  ) return;

  const choiceToLock = selectedChoice;
  const lockingConsequence = consequenceActive;

  lockPending = true;
  lockButton.disabled = true;

  try {
    if (lockingConsequence) {

      const authoritativePhase =
        (await get(ref(db, "game/phase"))).val();

      if (authoritativePhase !== "consequence") {
        throw new Error(
          "Consequence lock rejected: game phase is not consequence."
        );
      }

      const consequenceResult = await runTransaction(
        ref(db, "game/consequence"),
        consequence => {
          const currentConsequence = consequence || {
            choice: null,
            locked: false
          };

          if (currentConsequence.locked === true) return;

          return {
            choice: choiceToLock,
            locked: true
          };
        },
        { applyLocally: false }
      );

      if (!consequenceResult.committed) {
        throw new Error(
          "Consequence lock transaction aborted: a choice is already locked."
        );
      }

    } else {

      await set(
        ref(db, "game/player1/choice"),
        choiceToLock
      );
    }
  } catch (error) {
    locked = false;
    lockPending = false;
    lockButton.disabled = !selectedChoice;
    console.error(
      lockingConsequence
        ? "Consequence write failed:"
        : "Champion move write failed:",
      error
    );
    return;
  }

  locked = true;
  lockPending = false;
  selectedChoice = choiceToLock;

  buttons.forEach(button => {
    button.disabled = true;
  });

  lockButton.disabled = true;
  lockButton.textContent = consequenceActive
    ? "CHOICE LOCKED ✓"
    : "MOVE LOCKED ✓";

  selection.textContent = consequenceActive
    ? "FATE CHOSEN: " + selectedChoice.toUpperCase()
    : "FINAL MOVE: " + selectedChoice.toUpperCase();

  status.textContent = consequenceActive
    ? "FATE SEALED"
    : "WAITING FOR PLAYER 2...";

  status.className = "ready";
});

onValue(ref(db, "game/consequence"), snapshot => {

  restoreConsequenceChoice(snapshot.val() || {});
});

onValue(ref(db, "game/player1/choice"), snapshot => {
  savedBattleChoice = snapshot.val();
  restoreBattleChoice();
});

onValue(ref(db, "game/resetVersion"), snapshot => {
  const resetVersion = snapshot.val() ?? 0;

  if (currentResetVersion === null) {
    currentResetVersion = resetVersion;
    return;
  }

  if (resetVersion !== currentResetVersion) {
    currentResetVersion = resetVersion;
    currentRound = 1;
    resetController();
  }
});

onValue(ref(db, "game/round"), snapshot => {

  const newRound = snapshot.val();

  if (newRound === null) return;

  if (currentRound === null) {

    currentRound = newRound;
    return;
  }

  if (newRound !== currentRound) {

    currentRound = newRound;

    resetController();

  }

});
</script>

</body>
</html>
