<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player 2 | Gica & Vho</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.controller {
  max-width: 500px;
  margin: auto;
  text-align: center;
}

.brand {
  color: #7a2038;
  font-weight: bold;
  letter-spacing: 4px;
  margin-top: 20px;
}

h1 {
  margin: 12px 0 5px;
  font-size: 34px;
}

.player {
  color: #b58a39;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 35px;
}

.admin-button {
  width: 100%;
  margin-bottom: 14px;
  padding: 18px;
  border: 2px solid #c39a4b;
  background: #7a2038;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.admin-button:hover {
  background: #14213a;
}

.admin-button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

#startFinaleButton {
  margin-bottom: 30px;
}

#resetRpsMatchButton {
  background: #14213a;
}

#fullResetButton {
  border-color: #7a2038;
  background: #fffdf8;
  color: #7a2038;
  margin-bottom: 30px;
}

.instruction {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 25px;
}

.choice {
  width: 100%;
  height: 125px;
  margin-bottom: 15px;
  border: 2px solid #c39a4b;
  background: #fffdf8;
  color: #14213a;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
}

.choice.selected {
  background: #7a2038;
  color: white;
}

.choice:disabled {
  cursor: not-allowed;
  opacity: .65;
}

.emoji {
  font-size: 55px;
}

#selection {
  margin-top: 25px;
  font-weight: bold;
  color: #7a2038;
}

#lockButton {
  width: 100%;
  margin-top: 18px;
  padding: 18px;
  border: none;
  background: #14213a;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#lockButton:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#status {
  margin-top: 25px;
  padding: 18px;
  border: 1px solid #c39a4b;
  font-weight: bold;
  min-height: 55px;
}

.waiting {
  color: #7a2038;
}

.ready {
  background: #14213a;
  color: white;
}

.footer {
  margin-top: 35px;
  color: #9b7a39;
  font-size: 12px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="controller">

  <div class="brand">GICA & VHO</div>

  <h1>MAKE YOUR MOVE</h1>

  <div class="player">PLAYER 2</div>

  <button id="startIntroButton" class="admin-button">
    START FINAL BOSS INTRO
  </button>

  <button id="openRegistrationButton" class="admin-button">
    OPEN CHAMPION REGISTRATION
  </button>

  <button id="initializeBattleButton" class="admin-button" disabled>
    INITIALIZE FINAL BATTLE
  </button>

  <button id="revealGameMastersButton" class="admin-button" disabled>
    REVEAL GAME MASTERS
  </button>

  <button id="startBattleButton" class="admin-button" disabled>
    START BATTLE
  </button>

  <button id="challengeCompleteButton" class="admin-button" disabled>
    CHALLENGE COMPLETE
  </button>

  <button id="startFinaleButton" class="admin-button" disabled>
    START FINALE
  </button>

  <button id="resetRpsMatchButton" class="admin-button" disabled>
    RESET RPS MATCH
  </button>

  <button id="fullResetButton" class="admin-button" disabled>
    RESET FULL GAME
  </button>

  <div class="instruction">
    Choose your move, then lock it in.
  </div>

  <button class="choice" data-choice="rock" disabled>
    <span class="emoji">✊</span>
    ROCK
  </button>

  <button class="choice" data-choice="paper" disabled>
    <span class="emoji">✋</span>
    PAPER
  </button>

  <button class="choice" data-choice="scissors" disabled>
    <span class="emoji">✌️</span>
    SCISSORS
  </button>

  <div id="selection">
    NO MOVE SELECTED
  </div>

  <button id="lockButton" disabled>
    LOCK MY MOVE
  </button>

  <div id="status" class="waiting">
    WAITING FOR FINAL BATTLE
  </div>

  <div class="footer">
    THE WEDDING GAME • GICA & VHO
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",
  authDomain: "gica-vho-wedding-game.firebaseapp.com",
  databaseURL: "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gica-vho-wedding-game",
  storageBucket: "gica-vho-wedding-game.firebasestorage.app",
  messagingSenderId: "544288400742",
  appId: "1:544288400742:web:c26d421bb4486a4e1814a7"
};

let app;
let db;

try {
  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
} catch (error) {
  console.error("Firebase initialization failed on Admin controller:", error);
  throw error;
}

const playerConnectionRef =
  ref(db, "game/player2/connected");

onDisconnect(playerConnectionRef)
  .set(false)
  .then(() => set(playerConnectionRef, true))
  .catch(error => {
    console.error("Game Masters presence initialization failed:", error);
  });
let currentRound = null;
let currentResetVersion = null;
  
let selectedChoice = null;
let locked = false;
let battleActive = false;
let savedBattleChoice = null;

const buttons = document.querySelectorAll(".choice");
const lockButton = document.getElementById("lockButton");
const startIntroButton = document.getElementById("startIntroButton");
const openRegistrationButton = document.getElementById("openRegistrationButton");
const initializeBattleButton = document.getElementById("initializeBattleButton");
const revealGameMastersButton = document.getElementById("revealGameMastersButton");
const startBattleButton = document.getElementById("startBattleButton");
const challengeCompleteButton = document.getElementById("challengeCompleteButton");
const startFinaleButton = document.getElementById("startFinaleButton");
const resetRpsMatchButton = document.getElementById("resetRpsMatchButton");
const fullResetButton = document.getElementById("fullResetButton");
const selection = document.getElementById("selection");
const status = document.getElementById("status");
const pendingAdminCues = new Set();
let adminStateLoaded = false;

async function runAdminCue(button, cueName, mutate) {
  if (pendingAdminCues.has(cueName)) return false;

  pendingAdminCues.add(cueName);
  button.disabled = true;

  try {
    const result = await runTransaction(ref(db, "game"), game => {
      if (!game) return;
      return mutate(game);
    });
    if (result.committed) {
      adminPhase = result.snapshot.val()?.phase || "idle";
    }
    return result.committed;
  } catch (error) {
    console.error("Failed Admin phase write (" + cueName + "):", error);
    return false;
  } finally {
    pendingAdminCues.delete(cueName);
    updateAdminControls();
    updateStartBattleControl();
    updateChallengeCompleteControl();
    updateStartFinaleControl();
    updateRecoveryControls();
  }
}

startIntroButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    startIntroButton,
    "START FINAL BOSS INTRO",
    game => {
      if ((game.phase || "idle") !== "idle") return;
      game.phase = "intro";
      return game;
    }
  );
  if (committed) startIntroButton.textContent = "INTRO STARTED ✓";
});

openRegistrationButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    openRegistrationButton,
    "OPEN CHAMPION REGISTRATION",
    game => {
      if (game.phase !== "intro") return;
      game.phase = "registration";
      return game;
    }
  );
  if (committed) openRegistrationButton.textContent = "REGISTRATION OPEN ✓";
});

initializeBattleButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    initializeBattleButton,
    "INITIALIZE FINAL BATTLE",
    game => {
      if (game.phase !== "registration" || game.champion?.registered !== true) return;
      game.systemOverrideReady = false;
      game.phase = "initializing";
      return game;
    }
  );
  if (committed) initializeBattleButton.textContent = "FINAL BATTLE INITIALIZING ✓";
});

let championRegistered = false;
let adminPhase = "idle";
let systemOverrideReady = false;
let gameMasterRevealReady = false;
let championConnected = false;
let consequenceLocked = false;

function updateChallengeCompleteControl() {

  challengeCompleteButton.disabled = !(
    adminPhase === "champion-victory" ||
    (
      adminPhase === "consequence" &&
      consequenceLocked
    )
  ) || pendingAdminCues.has("CHALLENGE COMPLETE");
}

function updateStartFinaleControl() {

  startFinaleButton.disabled =
    adminPhase !== "challenge-complete" ||
    pendingAdminCues.has("START FINALE");
}

function updateStartBattleControl() {

  startBattleButton.disabled = !(
    adminPhase === "game-master-reveal" &&
    gameMasterRevealReady &&
    championRegistered &&
    championConnected
  ) || pendingAdminCues.has("START BATTLE");
}

function updateRecoveryControls() {
  const restartablePhases = new Set([
    "initializing",
    "game-master-reveal",
    "battle-intro",
    "battle",
    "champion-victory",
    "consequence",
    "challenge-complete",
    "finale"
  ]);

  resetRpsMatchButton.disabled = !(
    adminStateLoaded &&
    championRegistered &&
    restartablePhases.has(adminPhase)
  ) || pendingAdminCues.has("RESET RPS MATCH");

  fullResetButton.disabled =
    !adminStateLoaded ||
    pendingAdminCues.has("RESET FULL GAME");
}

function updateAdminControls() {
  startIntroButton.disabled =
    adminPhase !== "idle" || pendingAdminCues.has("START FINAL BOSS INTRO");
  openRegistrationButton.disabled =
    adminPhase !== "intro" || pendingAdminCues.has("OPEN CHAMPION REGISTRATION");
  initializeBattleButton.disabled = !(
    adminPhase === "registration" && championRegistered
  ) || pendingAdminCues.has("INITIALIZE FINAL BATTLE");

  revealGameMastersButton.disabled = !(
    adminPhase === "initializing" &&
    systemOverrideReady
  ) || pendingAdminCues.has("REVEAL GAME MASTERS");
}

onValue(ref(db, "game/champion/registered"), snapshot => {

  championRegistered = snapshot.val() === true;
  updateAdminControls();
  updateStartBattleControl();
  updateChallengeCompleteControl();
  updateRecoveryControls();

  if (!championRegistered) {
    initializeBattleButton.textContent = "INITIALIZE FINAL BATTLE";
  }
});

onValue(ref(db, "game/phase"), snapshot => {

  adminPhase = snapshot.val() || "idle";
  adminStateLoaded = true;
  battleActive = adminPhase === "battle";
  updateAdminControls();
  updateStartBattleControl();
  updateChallengeCompleteControl();
  updateStartFinaleControl();
  updateRecoveryControls();

  if (battleActive && restoreBattleChoice()) return;

  if (!battleActive) {

    buttons.forEach(button => {
      button.disabled = true;
    });

    lockButton.disabled = true;

    if (!locked) {
      status.textContent = "WAITING FOR FINAL BATTLE";
      status.className = "waiting";
    }

  } else if (!locked) {

    buttons.forEach(button => {
      button.disabled = false;
    });

    lockButton.disabled = !selectedChoice;
    status.textContent = "WAITING FOR YOUR MOVE";
    status.className = "waiting";
  }

  if (adminPhase !== "game-master-reveal") {
    revealGameMastersButton.textContent = "REVEAL GAME MASTERS";
  }

  if (adminPhase !== "battle-intro") {
    startBattleButton.textContent = "START BATTLE";
  }

  if (adminPhase !== "challenge-complete") {
    challengeCompleteButton.textContent = "CHALLENGE COMPLETE";
  }

  if (adminPhase !== "finale") {
    startFinaleButton.textContent = "START FINALE";
  }
});

onValue(ref(db, "game/systemOverrideReady"), snapshot => {

  systemOverrideReady = snapshot.val() === true;
  updateAdminControls();
});

revealGameMastersButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    revealGameMastersButton,
    "REVEAL GAME MASTERS",
    game => {
      if (game.phase !== "initializing" || game.systemOverrideReady !== true) return;
      game.gameMasterRevealReady = false;
      game.phase = "game-master-reveal";
      return game;
    }
  );
  if (committed) revealGameMastersButton.textContent = "GAME MASTERS REVEALED ✓";
});

onValue(ref(db, "game/gameMasterRevealReady"), snapshot => {

  gameMasterRevealReady = snapshot.val() === true;
  updateStartBattleControl();
});

onValue(ref(db, "game/player1/connected"), snapshot => {

  championConnected = snapshot.val() === true;
  updateStartBattleControl();
});

onValue(ref(db, "game/consequence/locked"), snapshot => {

  consequenceLocked = snapshot.val() === true;
  updateChallengeCompleteControl();
});

startBattleButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    startBattleButton,
    "START BATTLE",
    game => {
      if (
        game.phase !== "game-master-reveal" ||
        game.gameMasterRevealReady !== true ||
        game.champion?.registered !== true ||
        game.player1?.connected !== true
      ) return;

      game.round = 1;
      game.roundComplete = false;
      game.roundResolution = null;
      game.score = { player1: 0, player2: 0 };
      game.player1 ||= {};
      game.player1.choice = null;
      game.player2 ||= {};
      game.player2.choice = null;
      game.gameMasterRevealReady = false;
      game.matchWinner = null;
      game.consequence = { choice: null, locked: false };
      game.phase = "battle-intro";
      return game;
    }
  );

  if (committed) {
    resetController();
    startBattleButton.textContent = "BATTLE STARTED ✓";
  }
});

challengeCompleteButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    challengeCompleteButton,
    "CHALLENGE COMPLETE",
    game => {
      const championDone = game.phase === "champion-victory";
      const consequenceDone =
        game.phase === "consequence" && game.consequence?.locked === true;
      if (!championDone && !consequenceDone) return;
      game.phase = "challenge-complete";
      return game;
    }
  );
  if (committed) challengeCompleteButton.textContent = "CHALLENGE COMPLETE ✓";
});

startFinaleButton.addEventListener("click", async () => {
  const committed = await runAdminCue(
    startFinaleButton,
    "START FINALE",
    game => {
      if (game.phase !== "challenge-complete") return;
      game.phase = "finale";
      return game;
    }
  );
  if (committed) startFinaleButton.textContent = "FINALE STARTED ✓";
});

resetRpsMatchButton.addEventListener("click", async () => {
  const confirmed = window.confirm(
    "Reset the RPS match?\n\n" +
    "Scores and current moves will be cleared.\n" +
    "Champion registration will be preserved."
  );

  if (!confirmed) return;

  const committed = await runAdminCue(
    resetRpsMatchButton,
    "RESET RPS MATCH",
    game => {
      const restartablePhases = new Set([
        "initializing",
        "game-master-reveal",
        "battle-intro",
        "battle",
        "champion-victory",
        "consequence",
        "challenge-complete",
        "finale"
      ]);

      if (
        game.champion?.registered !== true ||
        !restartablePhases.has(game.phase)
      ) return;

      game.round = 1;
      game.roundComplete = false;
      game.roundResolution = null;
      game.score = { player1: 0, player2: 0 };
      game.player1 ||= {};
      game.player2 ||= {};
      game.player1.choice = null;
      game.player2.choice = null;
      game.matchWinner = null;
      game.consequence = { choice: null, locked: false };
      game.resetVersion = (game.resetVersion || 0) + 1;
      game.phase = "battle";
      return game;
    }
  );

  if (committed) resetRpsMatchButton.textContent = "RPS MATCH RESET ✓";
});

fullResetButton.addEventListener("click", async () => {
  const confirmed = window.confirm(
    "Reset the entire wedding game?\n\n" +
    "This will return the experience to the beginning and clear " +
    "the Champion, scores, and current game progress."
  );

  if (!confirmed) return;

  const committed = await runAdminCue(
    fullResetButton,
    "RESET FULL GAME",
    game => {
      game.round = 1;
      game.roundComplete = false;
      game.roundResolution = null;
      game.score = { player1: 0, player2: 0 };
      game.player1 ||= {};
      game.player2 ||= {};
      game.player1.choice = null;
      game.player2.choice = null;
      game.champion = { name: null, table: null, registered: false };
      game.systemOverrideReady = false;
      game.gameMasterRevealReady = false;
      game.matchWinner = null;
      game.consequence = { choice: null, locked: false };
      game.resetVersion = (game.resetVersion || 0) + 1;
      game.phase = "idle";
      return game;
    }
  );

  if (committed) fullResetButton.textContent = "FULL GAME RESET ✓";
});

function resetController() {

  selectedChoice = null;
  savedBattleChoice = null;
  locked = false;

  buttons.forEach(button => {
    button.disabled = !battleActive;
    button.classList.remove("selected");
  });

  lockButton.disabled = true;
  lockButton.textContent = "LOCK MY MOVE";

  selection.textContent =
    "NO MOVE SELECTED";

  status.textContent =
    battleActive
      ? "WAITING FOR YOUR MOVE"
      : "WAITING FOR FINAL BATTLE";

  status.className =
    "waiting";
}

function restoreBattleChoice() {
  if (!battleActive || !savedBattleChoice) return false;

  selectedChoice = savedBattleChoice;
  locked = true;
  buttons.forEach(button => {
    button.disabled = true;
    button.classList.toggle(
      "selected",
      button.dataset.choice === selectedChoice
    );
  });
  lockButton.disabled = true;
  lockButton.textContent = "MOVE LOCKED ✓";
  selection.textContent = "FINAL MOVE: " + selectedChoice.toUpperCase();
  status.textContent = "WAITING FOR PLAYER 1...";
  status.className = "ready";
  return true;
}

buttons.forEach(button => {
  button.addEventListener("click", () => {

    if (!battleActive || locked) return;

    selectedChoice = button.dataset.choice;

    buttons.forEach(btn =>
      btn.classList.remove("selected")
    );

    button.classList.add("selected");

    selection.textContent =
      "SELECTED: " + selectedChoice.toUpperCase();

    lockButton.disabled = false;
  });
});

lockButton.addEventListener("click", async () => {

  if (!battleActive || !selectedChoice || locked) return;

  locked = true;

  try {
    await set(
      ref(db, "game/player2/choice"),
      selectedChoice
    );
  } catch (error) {
    locked = false;
    lockButton.disabled = false;
    console.error("Game Masters move write failed:", error);
    return;
  }

  buttons.forEach(button => {
    button.disabled = true;
  });

  lockButton.disabled = true;
  lockButton.textContent = "MOVE LOCKED ✓";

  selection.textContent =
    "FINAL MOVE: " + selectedChoice.toUpperCase();

  status.textContent =
    "WAITING FOR PLAYER 1...";

  status.className = "ready";
});

onValue(ref(db, "game/round"), snapshot => {

  const newRound = snapshot.val();

  if (newRound === null) return;

  if (currentRound === null) {

    currentRound = newRound;
    return;
  }

  if (newRound !== currentRound) {

    currentRound = newRound;

    resetController();

  }

});

onValue(ref(db, "game/player2/choice"), snapshot => {
  savedBattleChoice = snapshot.val();
  restoreBattleChoice();
});

onValue(ref(db, "game/resetVersion"), snapshot => {
  const resetVersion = snapshot.val() ?? 0;

  if (currentResetVersion === null) {
    currentResetVersion = resetVersion;
    return;
  }

  if (resetVersion !== currentResetVersion) {
    currentResetVersion = resetVersion;
    currentRound = 1;
    resetController();
  }
});
</script>

</body>
</html>
