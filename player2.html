<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player 2 | Gica & Vho</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.controller {
  max-width: 500px;
  margin: auto;
  text-align: center;
}

.brand {
  color: #7a2038;
  font-weight: bold;
  letter-spacing: 4px;
  margin-top: 20px;
}

h1 {
  margin: 12px 0 5px;
  font-size: 34px;
}

.player {
  color: #b58a39;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 35px;
}

.instruction {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 25px;
}

.choice {
  width: 100%;
  height: 125px;
  margin-bottom: 15px;
  border: 2px solid #c39a4b;
  background: #fffdf8;
  color: #14213a;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
}

.choice.selected {
  background: #7a2038;
  color: white;
}

.choice:disabled {
  cursor: not-allowed;
  opacity: .65;
}

.emoji {
  font-size: 55px;
}

#selection {
  margin-top: 25px;
  font-weight: bold;
  color: #7a2038;
}

#lockButton {
  width: 100%;
  margin-top: 18px;
  padding: 18px;
  border: none;
  background: #14213a;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#lockButton:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#status {
  margin-top: 25px;
  padding: 18px;
  border: 1px solid #c39a4b;
  font-weight: bold;
  min-height: 55px;
}

.waiting {
  color: #7a2038;
}

.ready {
  background: #14213a;
  color: white;
}

.footer {
  margin-top: 35px;
  color: #9b7a39;
  font-size: 12px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="controller">

  <div class="brand">GICA & VHO</div>

  <h1>MAKE YOUR MOVE</h1>

  <div class="player">PLAYER 2</div>

  <div class="instruction">
    Choose your move, then lock it in.
  </div>

  <button class="choice" data-choice="rock">
    <span class="emoji">✊</span>
    ROCK
  </button>

  <button class="choice" data-choice="paper">
    <span class="emoji">✋</span>
    PAPER
  </button>

  <button class="choice" data-choice="scissors">
    <span class="emoji">✌️</span>
    SCISSORS
  </button>

  <div id="selection">
    NO MOVE SELECTED
  </div>

  <button id="lockButton" disabled>
    LOCK MY MOVE
  </button>

  <div id="status" class="waiting">
    WAITING FOR YOUR MOVE
  </div>

  <div class="footer">
    THE WEDDING GAME • GICA & VHO
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",
  authDomain: "gica-vho-wedding-game.firebaseapp.com",
  databaseURL: "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gica-vho-wedding-game",
  storageBucket: "gica-vho-wedding-game.firebasestorage.app",
  messagingSenderId: "544288400742",
  appId: "1:544288400742:web:c26d421bb4486a4e1814a7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const playerConnectionRef =
  ref(db, "game/player2/connected");

set(playerConnectionRef, true);

onDisconnect(playerConnectionRef)
  .set(false);
let currentRound = null;
  
let selectedChoice = null;
let locked = false;

const buttons = document.querySelectorAll(".choice");
const lockButton = document.getElementById("lockButton");
const selection = document.getElementById("selection");
const status = document.getElementById("status");

function resetController() {

  selectedChoice = null;
  locked = false;

  buttons.forEach(button => {
    button.disabled = false;
    button.classList.remove("selected");
  });

  lockButton.disabled = true;
  lockButton.textContent = "LOCK MY MOVE";

  selection.textContent =
    "NO MOVE SELECTED";

  status.textContent =
    "WAITING FOR YOUR MOVE";

  status.className =
    "waiting";
} 
buttons.forEach(button => {
  button.addEventListener("click", () => {

    if (locked) return;

    selectedChoice = button.dataset.choice;

    buttons.forEach(btn =>
      btn.classList.remove("selected")
    );

    button.classList.add("selected");

    selection.textContent =
      "SELECTED: " + selectedChoice.toUpperCase();

    lockButton.disabled = false;
  });
});

lockButton.addEventListener("click", async () => {

  if (!selectedChoice || locked) return;

  locked = true;

  await set(
    ref(db, "game/player2/choice"),
    selectedChoice
  );

  buttons.forEach(button => {
    button.disabled = true;
  });

  lockButton.disabled = true;
  lockButton.textContent = "MOVE LOCKED ✓";

  selection.textContent =
    "FINAL MOVE: " + selectedChoice.toUpperCase();

  status.textContent =
    "WAITING FOR PLAYER 1...";

  status.className = "ready";
});

onValue(ref(db, "game/round"), snapshot => {

  const newRound = snapshot.val();

  if (newRound === null) return;

  if (currentRound === null) {

    currentRound = newRound;

    if (locked) {
      resetController();
    }

    return;
  }

  if (newRound !== currentRound) {

    currentRound = newRound;

    resetController();

  }

});
</script>

</body>
</html>
