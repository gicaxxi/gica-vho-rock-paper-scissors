<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gica & Vho | Rock Paper Scissors</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f1e5;
      color: #14213a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .game {
      width: 100%;
      max-width: 1200px;
      min-height: 650px;
      border: 2px solid #c39a4b;
      background: #fffdf8;
      padding: 40px;
      text-align: center;
      position: relative;
    }

    .brand {
      color: #7a2038;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      letter-spacing: 2px;
      color: #14213a;
    }

    .subtitle {
      color: #b58a39;
      letter-spacing: 4px;
      font-weight: bold;
      margin: 14px 0 35px;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .score {
      width: 190px;
      padding: 16px;
      border: 1px solid #c39a4b;
    }

    .player1 {
      background: #7a2038;
      color: #fff;
    }

    .player2 {
      background: #14213a;
      color: #fff;
    }

    .score-label {
      color: #e5bd68;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .score-number {
      font-size: 44px;
      font-weight: bold;
      margin-top: 5px;
    }

    .round {
      color: #7a2038;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    #message {
      font-size: 29px;
      font-weight: bold;
      min-height: 45px;
      margin: 10px 0 30px;
    }

    .players {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      margin-top: 15px;
    }

    .player-card {
      width: 290px;
      min-height: 220px;
      border: 2px solid #c39a4b;
      padding: 25px;
      background: #f7f1e5;
    }

    .player-name {
      color: #7a2038;
      letter-spacing: 2px;
      font-size: 13px;
      font-weight: bold;
    }

    .choice {
      font-size: 80px;
      margin: 20px 0 10px;
    }

    .choice-name {
      font-size: 20px;
      font-weight: bold;
    }

    .waiting {
      color: #8a8a8a;
    }

    .vs {
      color: #b58a39;
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      margin-top: 30px;
      font-size: 16px;
      color: #755e38;
    }

    button {
      margin-top: 25px;
      border: 1px solid #b58a39;
      background: #14213a;
      color: white;
      padding: 13px 26px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7a2038;
    }

    @media(max-width:700px) {
      .players {
        flex-direction: column;
        gap: 15px;
      }

      .vs {
        margin: 0;
      }

      .game {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

<div class="game">

  <div class="brand">GICA & VHO</div>

  <h1>ROCK • PAPER • SCISSORS</h1>

  <div class="subtitle">
    THE WEDDING GAME
  </div>

  <div class="scoreboard">

    <div class="score player1">
      <div class="score-label">PLAYER 1</div>
      <div class="score-number" id="score1">0</div>
    </div>

    <div class="score player2">
      <div class="score-label">PLAYER 2</div>
      <div class="score-number" id="score2">0</div>
    </div>

  </div>

  <div class="round">
    ROUND <span id="roundNumber">1</span>
  </div>

  <div id="message">
    WAITING FOR PLAYERS
  </div>

  <div class="players">

    <div class="player-card">
      <div class="player-name">PLAYER 1</div>

      <div class="choice" id="player1Choice">
        ?
      </div>

      <div class="choice-name waiting" id="player1Status">
        WAITING...
      </div>
    </div>

    <div class="vs">
      VS
    </div>

    <div class="player-card">
      <div class="player-name">PLAYER 2</div>

      <div class="choice" id="player2Choice">
        ?
      </div>

      <div class="choice-name waiting" id="player2Status">
        WAITING...
      </div>
    </div>

  </div>

  <div class="status" id="gameStatus">
    Waiting for Player 1 and Player 2 to make their move.
  </div>

  <button id="resetButton">
    RESET GAME
  </button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",

  authDomain:
  "gica-vho-wedding-game.firebaseapp.com",

  databaseURL:
  "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "gica-vho-wedding-game",

  storageBucket:
  "gica-vho-wedding-game.firebasestorage.app",

  messagingSenderId:
  "544288400742",

  appId:
  "1:544288400742:web:c26d421bb4486a4e1814a7"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const gameRef = ref(db, "game");


let gameData = {};

let previousRoundResolved = false;


function emoji(choice) {

  if (choice === "rock") return "✊";

  if (choice === "paper") return "✋";

  if (choice === "scissors") return "✌️";

  return "?";
}


function determineWinner(p1, p2) {

  if (p1 === p2) {
    return "draw";
  }

  if (
    (p1 === "rock" && p2 === "scissors") ||
    (p1 === "paper" && p2 === "rock") ||
    (p1 === "scissors" && p2 === "paper")
  ) {
    return "player1";
  }

  return "player2";
}


async function resolveRound(data) {

  if (
    !data.player1?.choice ||
    !data.player2?.choice ||
    previousRoundResolved
  ) {
    return;
  }

  previousRoundResolved = true;

  document.getElementById("message").textContent =
    "3 • 2 • 1 • SHOOT!";

  await new Promise(resolve => setTimeout(resolve, 1500));


  const p1 = data.player1.choice;

  const p2 = data.player2.choice;

  document.getElementById("player1Choice").textContent =
    emoji(p1);

  document.getElementById("player2Choice").textContent =
    emoji(p2);

  document.getElementById("player1Status").textContent =
    p1.toUpperCase();

  document.getElementById("player2Status").textContent =
    p2.toUpperCase();


  const result =
    determineWinner(p1, p2);


  let score1 =
    data.score?.player1 || 0;

  let score2 =
    data.score?.player2 || 0;


  if (result === "player1") {

    score1++;

    document.getElementById("message").textContent =
      "PLAYER 1 WINS!";

  }

  else if (result === "player2") {

    score2++;

    document.getElementById("message").textContent =
      "PLAYER 2 WINS!";

  }

  else {

    document.getElementById("message").textContent =
      "IT'S A DRAW!";

  }


  await set(
    ref(db, "game/score"),
    {
      player1: score1,
      player2: score2
    }
  );


  document.getElementById("gameStatus").textContent =
    "Round complete — prepare for the next round.";

}


onValue(gameRef, snapshot => {

  const data = snapshot.val() || {};

  gameData = data;


  const score1 =
    data.score?.player1 || 0;

  const score2 =
    data.score?.player2 || 0;


  document.getElementById("score1").textContent =
    score1;

  document.getElementById("score2").textContent =
    score2;


  document.getElementById("roundNumber").textContent =
    data.round || 1;


  if (data.player1?.choice) {

    document.getElementById("player1Status").textContent =
      "READY ✓";

  } else {

    document.getElementById("player1Status").textContent =
      "WAITING...";

  }


  if (data.player2?.choice) {

    document.getElementById("player2Status").textContent =
      "READY ✓";

  } else {

    document.getElementById("player2Status").textContent =
      "WAITING...";

  }


  if (
    data.player1?.choice &&
    data.player2?.choice
  ) {

    resolveRound(data);

  }

});


document
.getElementById("resetButton")
.addEventListener("click", async () => {

  previousRoundResolved = false;

  await set(gameRef, {

    round: 1,

    player1: {
      choice: null
    },

    player2: {
      choice: null
    },

    score: {
      player1: 0,
      player2: 0
    }

  });

  document.getElementById("message").textContent =
    "WAITING FOR PLAYERS";

  document.getElementById("player1Choice").textContent =
    "?";

  document.getElementById("player2Choice").textContent =
    "?";

  document.getElementById("gameStatus").textContent =
    "Waiting for Player 1 and Player 2 to make their move.";

});


</script>

</body>
</html>
