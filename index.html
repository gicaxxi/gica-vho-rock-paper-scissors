<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gica & Vho | Rock Paper Scissors</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #141f34;
      color: #f6efde;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 1000px;
      text-align: center;
      border: 2px solid #c1994c;
      padding: 40px 25px;
      background: #141f34;
    }

    .names {
      color: #c1994c;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 60px);
      margin: 0;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #c1994c;
      margin: 12px 0 35px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .score {
      width: 180px;
      padding: 15px;
      border: 1px solid #c1994c;
      background: #691d30;
    }

    .score.player2 {
      background: #202c45;
    }

    .score-name {
      font-size: 13px;
      color: #c1994c;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .score-number {
      font-size: 45px;
      font-weight: bold;
      margin-top: 5px;
    }

    .message {
      min-height: 70px;
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 2px solid #c1994c;
      background: #f6efde;
      color: #141f34;
      width: 200px;
      height: 180px;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-5px);
      background: #c1994c;
    }

    .emoji {
      display: block;
      font-size: 65px;
      margin-bottom: 15px;
    }

    .reset {
      margin-top: 35px;
      width: auto;
      height: auto;
      padding: 12px 30px;
      background: transparent;
      color: #f6efde;
      font-size: 14px;
    }

    .result {
      margin-top: 25px;
      font-size: 18px;
      color: #c1994c;
      min-height: 30px;
    }

    @media (max-width: 600px) {
      .game {
        padding: 25px 15px;
      }

      .score {
        width: 140px;
      }

      button {
        width: 90px;
        height: 120px;
        font-size: 12px;
      }

      .emoji {
        font-size: 40px;
      }

      .choices {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <div class="names">GICA & VHO</div>

    <h1>ROCK • PAPER • SCISSORS</h1>

    <div class="subtitle">
      THE WEDDING GAME
    </div>

    <div class="scoreboard">

      <div class="score">
        <div class="score-name">PLAYER 1</div>
        <div class="score-number" id="score1">0</div>
      </div>

      <div class="score player2">
        <div class="score-name">PLAYER 2</div>
        <div class="score-number" id="score2">0</div>
      </div>

    </div>

    <div class="message" id="message">
      MAKE YOUR MOVE
    </div>

    <div class="choices">

      <button onclick="play('rock')">
        <span class="emoji">✊</span>
        ROCK
      </button>

      <button onclick="play('paper')">
        <span class="emoji">✋</span>
        PAPER
      </button>

      <button onclick="play('scissors')">
        <span class="emoji">✌️</span>
        SCISSORS
      </button>

    </div>

    <div class="result" id="result"></div>

    <button class="reset" onclick="resetGame()">
      RESET GAME
    </button>

  </div>

  <script>

    let score1 = 0;
    let score2 = 0;

    function play(player1Choice) {

      const choices = ["rock", "paper", "scissors"];

      const player2Choice =
        choices[Math.floor(Math.random() * choices.length)];

      let result = "";

      if (player1Choice === player2Choice) {

        result = "IT'S A DRAW!";

      } else if (

        (player1Choice === "rock" && player2Choice === "scissors") ||
        (player1Choice === "paper" && player2Choice === "rock") ||
        (player1Choice === "scissors" && player2Choice === "paper")

      ) {

        score1++;
        result = "PLAYER 1 WINS!";

      } else {

        score2++;
        result = "PLAYER 2 WINS!";

      }

      document.getElementById("score1").textContent = score1;
      document.getElementById("score2").textContent = score2;

      document.getElementById("message").textContent = result;

      document.getElementById("result").textContent =
        "Player 1: " + player1Choice.toUpperCase() +
        "  •  Player 2: " + player2Choice.toUpperCase();

    }

    function resetGame() {

      score1 = 0;
      score2 = 0;

      document.getElementById("score1").textContent = "0";
      document.getElementById("score2").textContent = "0";

      document.getElementById("message").textContent =
        "MAKE YOUR MOVE";

      document.getElementById("result").textContent = "";

    }

  </script>

</body>
</html>
