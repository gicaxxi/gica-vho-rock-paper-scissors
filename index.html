<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gica & Vho | Final Boss Battle</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.game {
  width: 100%;
  max-width: 1200px;
  min-height: 650px;
  border: 2px solid #c39a4b;
  background: #fffdf8;
  padding: 40px;
  text-align: center;
}

.brand {
  color: #7a2038;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 5px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: clamp(35px, 5vw, 60px);
  letter-spacing: 2px;
}

.subtitle {
  color: #b58a39;
  font-weight: bold;
  letter-spacing: 4px;
  margin: 12px 0 30px;
}

/* SCORE */

.scoreboard {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

.score {
  width: 220px;
  padding: 17px;
  border: 1px solid #c39a4b;
}

.champion {
  background: #7a2038;
  color: white;
}

.boss {
  background: #14213a;
  color: white;
}

.score-label {
  color: #e5bd68;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

.score-number {
  font-size: 46px;
  font-weight: bold;
  margin-top: 4px;
}

.round {
  color: #7a2038;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

#message {
  font-size: 31px;
  font-weight: bold;
  min-height: 50px;
  margin: 10px 0 25px;
}

/* PLAYERS */

.players {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 45px;
}

.player-card {
  width: 310px;
  min-height: 230px;
  border: 2px solid #c39a4b;
  padding: 25px;
  background: #f7f1e5;
}

.player-name {
  color: #7a2038;
  letter-spacing: 2px;
  font-size: 13px;
  font-weight: bold;
}

.choice {
  font-size: 85px;
  margin: 20px 0 8px;
}

.choice-name {
  font-size: 20px;
  font-weight: bold;
}

.waiting {
  color: #8a8a8a;
}

.ready {
  color: #7a2038;
}

.vs {
  color: #b58a39;
  font-size: 24px;
  font-weight: bold;
}

#gameStatus {
  margin-top: 25px;
  color: #755e38;
}

/* WINNER */

#winnerScreen {
  display: none;
  margin-top: 25px;
  padding: 30px;
  border: 2px solid #c39a4b;
  background: #f7f1e5;
}

#winnerTitle {
  margin: 0;
  color: #7a2038;
  font-size: 38px;
}

#winnerMessage {
  margin-top: 10px;
  font-size: 20px;
}

button {
  margin-top: 22px;
  padding: 14px 30px;
  border: 1px solid #c39a4b;
  background: #14213a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #7a2038;
}

@media(max-width:700px) {

  .players {
    flex-direction: column;
    gap: 15px;
  }

  .score {
    width: 155px;
  }

  .game {
    padding: 25px 15px;
  }

}


/* HOST CONTROLS */

.host-controls {
  margin-top: 22px;
  text-align: center;
}

#resetGameButton {
  margin: 0;
  padding: 9px 20px;
  background: transparent;
  color: #755e38;
  border: 1px solid #c39a4b;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
  cursor: pointer;
}

#resetGameButton:hover {
  background: #14213a;
  color: white;
}

</style>
</head>


<body>

<div class="game">

  <div class="brand">
    GICA & VHO
  </div>

  <h1>
    ROCK • PAPER • SCISSORS
  </h1>

  <div class="subtitle">
    FINAL BOSS BATTLE
  </div>


  <div class="scoreboard">

    <div class="score champion">

      <div class="score-label">
        🏆 CHAMPION
      </div>

      <div class="score-number" id="score1">
        0
      </div>

    </div>


    <div class="score boss">

      <div class="score-label">
        👑 FINAL BOSS
      </div>

      <div class="score-number" id="score2">
        0
      </div>

    </div>

  </div>


  <div class="round">
    ROUND <span id="roundNumber">1</span>
  </div>


  <div id="message">
    WAITING FOR PLAYERS
  </div>


  <div class="players">

    <div class="player-card">

      <div class="player-name">
        🏆 CHAMPION
      </div>

      <div class="choice" id="player1Choice">
        ?
      </div>

      <div class="choice-name waiting"
           id="player1Status">
        WAITING...
      </div>

    </div>


    <div class="vs">
      VS
    </div>


    <div class="player-card">

      <div class="player-name">
        👑 GICA & VHO
      </div>

      <div class="choice" id="player2Choice">
        ?
      </div>

      <div class="choice-name waiting"
           id="player2Status">
        WAITING...
      </div>

    </div>

  </div>


<div id="gameStatus">
  Waiting for both sides to lock their moves.
</div>

<div id="winnerScreen">
  ...
</div>

<div class="host-controls">
  <button id="resetGameButton">
    RESET GAME
  </button>
</div>

</div>

 <div class="host-controls">

  <button id="resetGameButton">
    RESET GAME
  </button>

</div>

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  set,
  update
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",

  authDomain:
  "gica-vho-wedding-game.firebaseapp.com",

  databaseURL:
  "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "gica-vho-wedding-game",

  storageBucket:
  "gica-vho-wedding-game.firebasestorage.app",

  messagingSenderId:
  "544288400742",

  appId:
  "1:544288400742:web:c26d421bb4486a4e1814a7"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const gameRef =
ref(db, "game");


let resolving = false;

let roundTransitionRunning = false;


/* ---------------------------
   HELPERS
---------------------------- */

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve, ms));


function emoji(choice) {

  if (choice === "rock")
    return "✊";

  if (choice === "paper")
    return "✋";

  if (choice === "scissors")
    return "✌️";

  return "?";
}


function determineWinner(p1, p2) {

  if (p1 === p2)
    return "draw";


  if (

    (p1 === "rock" &&
     p2 === "scissors")

    ||

    (p1 === "paper" &&
     p2 === "rock")

    ||

    (p1 === "scissors" &&
     p2 === "paper")

  ) {

    return "player1";

  }

  return "player2";
}


/* ---------------------------
   ROUND
---------------------------- */

async function resolveRound(data) {

  if (resolving)
    return;

  if (data.roundComplete)
    return;


  const p1 =
    data.player1?.choice;

  const p2 =
    data.player2?.choice;


  if (!p1 || !p2)
    return;


  resolving = true;


  document.getElementById("message")
    .textContent =
    "BOTH PLAYERS READY ✓";


  await sleep(800);


  document.getElementById("message")
    .textContent = "3";

  await sleep(700);


  document.getElementById("message")
    .textContent = "2";

  await sleep(700);


  document.getElementById("message")
    .textContent = "1";

  await sleep(700);


  document.getElementById("message")
    .textContent = "SHOOT!";

  await sleep(550);


  /* REVEAL */

  document.getElementById(
    "player1Choice"
  ).textContent =
    emoji(p1);


  document.getElementById(
    "player2Choice"
  ).textContent =
    emoji(p2);


  document.getElementById(
    "player1Status"
  ).textContent =
    p1.toUpperCase();


  document.getElementById(
    "player2Status"
  ).textContent =
    p2.toUpperCase();


  const result =
    determineWinner(p1, p2);


  let score1 =
    data.score?.player1 || 0;

  let score2 =
    data.score?.player2 || 0;


  if (result === "player1") {

    score1++;

    document.getElementById(
      "message"
    ).textContent =
      "CHAMPION WINS THE ROUND!";

  }

  else if (result === "player2") {

    score2++;

    document.getElementById(
      "message"
    ).textContent =
      "FINAL BOSS WINS THE ROUND!";

  }

  else {

    document.getElementById(
      "message"
    ).textContent =
      "IT'S A DRAW!";

  }


  await update(
    gameRef,
    {

      "score/player1":
        score1,

      "score/player2":
        score2,

      roundComplete:
        true

    }
  );


  /* MATCH WINNER */

  if (
    score1 >= 2 ||
    score2 >= 2
  ) {

    await sleep(1600);

    showMatchWinner(
      score1,
      score2
    );

    return;

  }


  /* AUTOMATIC NEXT ROUND */

  await sleep(3000);

  await startNextRound(
    data.round || 1
  );

}


/* ---------------------------
   NEXT ROUND
---------------------------- */

async function startNextRound(round) {

  if (roundTransitionRunning)
    return;


  roundTransitionRunning =
    true;


  document.getElementById(
    "message"
  ).textContent =
    "NEXT ROUND";


  await sleep(1000);


  await update(
    gameRef,
    {

      round:
        round + 1,

      "player1/choice":
        null,

      "player2/choice":
        null,

      roundComplete:
        false

    }
  );


  resolving = false;

  roundTransitionRunning =
    false;

}


/* ---------------------------
   MATCH WINNER
---------------------------- */

function showMatchWinner(
  score1,
  score2
) {

  const winnerScreen =
    document.getElementById(
      "winnerScreen"
    );


  winnerScreen.style.display =
    "block";


  if (score1 >= 2) {

    document.getElementById(
      "winnerTitle"
    ).textContent =
      "🏆 FINAL BOSS DEFEATED!";


    document.getElementById(
      "winnerMessage"
    ).textContent =
      "THE CHAMPION WINS — BONUS REWARD UNLOCKED!";

  }

  else {

    document.getElementById(
      "winnerTitle"
    ).textContent =
      "👑 FINAL BOSS WINS!";


    document.getElementById(
      "winnerMessage"
    ).textContent =
      "CONSEQUENCE UNLOCKED!";

  }


  document.getElementById(
    "gameStatus"
  ).textContent =
    "Battle complete.";

}


/* ---------------------------
   FIREBASE LISTENER
---------------------------- */

onValue(
  gameRef,
  snapshot => {

  const data =
    snapshot.val() || {};


  document.getElementById(
    "score1"
  ).textContent =
    data.score?.player1 || 0;


  document.getElementById(
    "score2"
  ).textContent =
    data.score?.player2 || 0;


  document.getElementById(
    "roundNumber"
  ).textContent =
    data.round || 1;


  if (!data.roundComplete) {


    document.getElementById(
      "winnerScreen"
    ).style.display =
      "none";


    document.getElementById(
      "player1Choice"
    ).textContent =
      "?";


    document.getElementById(
      "player2Choice"
    ).textContent =
      "?";


if (data.player1?.choice) {

  document.getElementById(
    "player1Status"
  ).textContent =
    "READY ✓";

}

else if (data.player1?.connected) {

  document.getElementById(
    "player1Status"
  ).textContent =
    "CONNECTED ✓";

}

else {

  document.getElementById(
    "player1Status"
  ).textContent =
    "WAITING TO JOIN";

}


    if (data.player2?.choice) {

  document.getElementById(
    "player2Status"
  ).textContent =
    "READY ✓";

}

else if (data.player2?.connected) {

  document.getElementById(
    "player2Status"
  ).textContent =
    "CONNECTED ✓";

}

else {

  document.getElementById(
    "player2Status"
  ).textContent =
    "WAITING TO JOIN";

}

if (
  data.player1?.choice
  &&
  data.player2?.choice
) {

  resolveRound(data);

}

else if (
  data.player1?.connected
  &&
  data.player2?.connected
) {

  document.getElementById(
    "message"
  ).textContent =
    "BOTH PLAYERS CONNECTED ✓";


  document.getElementById(
    "gameStatus"
  ).textContent =
    "Choose your moves and lock them in.";

}

else if (
  data.player1?.connected
  ||
  data.player2?.connected
) {

  document.getElementById(
    "message"
  ).textContent =
    "WAITING FOR THE OTHER SIDE";


  document.getElementById(
    "gameStatus"
  ).textContent =
    "One player has joined the battle.";

}

else {

  document.getElementById(
    "message"
  ).textContent =
    "WAITING FOR PLAYERS";


  document.getElementById(
    "gameStatus"
  ).textContent =
    "Scan the QR code to join the battle.";

}

  }

});


/* ---------------------------
   NEW GAME
---------------------------- */

document.getElementById(
  "newGameButton"
)
.addEventListener(
  "click",
  async () => {


    resolving = false;

    roundTransitionRunning =
      false;


    await update(
  gameRef,
  {

    round: 1,

    "player1/choice":
      null,

    "player2/choice":
      null,

    "score/player1":
      0,

    "score/player2":
      0,

    roundComplete:
      false

  }
);

  }
);

document.getElementById(
  "resetGameButton"
)
.addEventListener(
  "click",
  async () => {

    resolving = false;
    roundTransitionRunning = false;

    await update(
      gameRef,
      {
        round: 1,
        "player1/choice": null,
        "player2/choice": null,
        "score/player1": 0,
        "score/player2": 0,
        roundComplete: false
      }
    );

    document.getElementById(
      "winnerScreen"
    ).style.display = "none";

    document.getElementById(
      "message"
    ).textContent =
      "WAITING FOR PLAYERS";

    document.getElementById(
      "player1Choice"
    ).textContent = "?";

    document.getElementById(
      "player2Choice"
    ).textContent = "?";

  }
); 
</script>

</body>
</html>
