<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gica & Vho | Rock Paper Scissors</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f1e5;
  color: #14213a;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.game {
  width: 100%;
  max-width: 1200px;
  min-height: 650px;
  border: 2px solid #c39a4b;
  background: #fffdf8;
  padding: 40px;
  text-align: center;
}

.brand {
  color: #7a2038;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 5px;
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-size: clamp(34px, 5vw, 60px);
  letter-spacing: 2px;
}

.subtitle {
  color: #b58a39;
  letter-spacing: 4px;
  font-weight: bold;
  margin: 14px 0 30px;
}

.scoreboard {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
}

.score {
  width: 190px;
  padding: 16px;
  border: 1px solid #c39a4b;
}

.player1 {
  background: #7a2038;
  color: white;
}

.player2 {
  background: #14213a;
  color: white;
}

.score-label {
  color: #e5bd68;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.score-number {
  font-size: 44px;
  font-weight: bold;
  margin-top: 5px;
}

.round {
  color: #7a2038;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

#message {
  font-size: 30px;
  font-weight: bold;
  min-height: 45px;
  margin: 10px 0 25px;
}

.players {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 50px;
  margin-top: 15px;
}

.player-card {
  width: 290px;
  min-height: 220px;
  border: 2px solid #c39a4b;
  padding: 25px;
  background: #f7f1e5;
}

.player-name {
  color: #7a2038;
  letter-spacing: 2px;
  font-size: 13px;
  font-weight: bold;
}

.choice {
  font-size: 80px;
  margin: 20px 0 10px;
}

.choice-name {
  font-size: 20px;
  font-weight: bold;
}

.waiting {
  color: #8a8a8a;
}

.vs {
  color: #b58a39;
  font-size: 22px;
  font-weight: bold;
}

.status {
  margin-top: 25px;
  font-size: 16px;
  color: #755e38;
}

button {
  margin-top: 22px;
  border: 1px solid #b58a39;
  background: #14213a;
  color: white;
  padding: 14px 28px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #7a2038;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#nextRoundButton {
  display: none;
}

#winnerBanner {
  display: none;
  margin-top: 25px;
  padding: 25px;
  border: 2px solid #c39a4b;
  background: #f7f1e5;
}

#winnerBanner h2 {
  margin: 0 0 10px;
  color: #7a2038;
  font-size: 34px;
}

#winnerBanner p {
  margin: 0;
  color: #b58a39;
  font-weight: bold;
}

@media(max-width:700px) {
  .players {
    flex-direction: column;
    gap: 15px;
  }

  .game {
    padding: 25px 15px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="brand">GICA & VHO</div>

  <h1>ROCK • PAPER • SCISSORS</h1>

  <div class="subtitle">THE WEDDING GAME</div>

  <div class="scoreboard">

    <div class="score player1">
      <div class="score-label">PLAYER 1</div>
      <div class="score-number" id="score1">0</div>
    </div>

    <div class="score player2">
      <div class="score-label">PLAYER 2</div>
      <div class="score-number" id="score2">0</div>
    </div>

  </div>

  <div class="round">
    ROUND <span id="roundNumber">1</span>
  </div>

  <div id="message">
    WAITING FOR PLAYERS
  </div>

  <div class="players">

    <div class="player-card">
      <div class="player-name">PLAYER 1</div>

      <div class="choice" id="player1Choice">?</div>

      <div class="choice-name waiting" id="player1Status">
        WAITING...
      </div>
    </div>

    <div class="vs">VS</div>

    <div class="player-card">
      <div class="player-name">PLAYER 2</div>

      <div class="choice" id="player2Choice">?</div>

      <div class="choice-name waiting" id="player2Status">
        WAITING...
      </div>
    </div>

  </div>

  <div class="status" id="gameStatus">
    Waiting for both players to lock their moves.
  </div>

  <button id="nextRoundButton">
    NEXT ROUND
  </button>

  <div id="winnerBanner">
    <h2 id="matchWinner"></h2>
    <p>FIRST TO 3 WINS</p>

    <button id="newGameButton">
      NEW GAME
    </button>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  update
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAu56OSm_csaTXPyGrKfy_wTYY9DsPhMW8",
  authDomain: "gica-vho-wedding-game.firebaseapp.com",
  databaseURL: "https://gica-vho-wedding-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gica-vho-wedding-game",
  storageBucket: "gica-vho-wedding-game.firebasestorage.app",
  messagingSenderId: "544288400742",
  appId: "1:544288400742:web:c26d421bb4486a4e1814a7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const gameRef = ref(db, "game");

let resolving = false;
let currentRound = 1;

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

function emoji(choice) {
  if (choice === "rock") return "✊";
  if (choice === "paper") return "✋";
  if (choice === "scissors") return "✌️";
  return "?";
}

function determineWinner(p1, p2) {

  if (p1 === p2) {
    return "draw";
  }

  if (
    (p1 === "rock" && p2 === "scissors") ||
    (p1 === "paper" && p2 === "rock") ||
    (p1 === "scissors" && p2 === "paper")
  ) {
    return "player1";
  }

  return "player2";
}

async function resolveRound(data) {

  if (resolving) return;

  resolving = true;

  const p1 = data.player1?.choice;
  const p2 = data.player2?.choice;

  if (!p1 || !p2) {
    resolving = false;
    return;
  }

  document.getElementById("message").textContent = "3";
  await sleep(700);

  document.getElementById("message").textContent = "2";
  await sleep(700);

  document.getElementById("message").textContent = "1";
  await sleep(700);

  document.getElementById("message").textContent = "SHOOT!";
  await sleep(500);

  document.getElementById("player1Choice").textContent =
    emoji(p1);

  document.getElementById("player2Choice").textContent =
    emoji(p2);

  document.getElementById("player1Status").textContent =
    p1.toUpperCase();

  document.getElementById("player2Status").textContent =
    p2.toUpperCase();

  const result =
    determineWinner(p1, p2);

  let score1 =
    data.score?.player1 || 0;

  let score2 =
    data.score?.player2 || 0;

  if (result === "player1") {

    score1++;

    document.getElementById("message").textContent =
      "PLAYER 1 WINS THE ROUND!";

  } else if (result === "player2") {

    score2++;

    document.getElementById("message").textContent =
      "PLAYER 2 WINS THE ROUND!";

  } else {

    document.getElementById("message").textContent =
      "IT'S A DRAW!";

  }

  await update(ref(db, "game"), {
    "score/player1": score1,
    "score/player2": score2,
    "roundComplete": true
  });

  if (score1 >= 3 || score2 >= 3) {

    const winner =
      score1 >= 3 ? "PLAYER 1" : "PLAYER 2";

    document.getElementById("winnerBanner").style.display =
      "block";

    document.getElementById("matchWinner").textContent =
      "🏆 " + winner + " WINS THE MATCH!";

    document.getElementById("nextRoundButton").style.display =
      "none";

    document.getElementById("gameStatus").textContent =
      "Match complete.";

  } else {

    document.getElementById("nextRoundButton").style.display =
      "inline-block";

    document.getElementById("gameStatus").textContent =
      "Round complete. Host may start the next round.";

  }
}

onValue(gameRef, snapshot => {

  const data = snapshot.val() || {};

  currentRound =
    data.round || 1;

  document.getElementById("roundNumber").textContent =
    currentRound;

  document.getElementById("score1").textContent =
    data.score?.player1 || 0;

  document.getElementById("score2").textContent =
    data.score?.player2 || 0;

  if (!data.roundComplete) {

    document.getElementById("nextRoundButton").style.display =
      "none";

    document.getElementById("winnerBanner").style.display =
      "none";

    document.getElementById("player1Choice").textContent =
      "?";

    document.getElementById("player2Choice").textContent =
      "?";

    if (data.player1?.choice) {
      document.getElementById("player1Status").textContent =
        "READY ✓";
    } else {
      document.getElementById("player1Status").textContent =
        "WAITING...";
    }

    if (data.player2?.choice) {
      document.getElementById("player2Status").textContent =
        "READY ✓";
    } else {
      document.getElementById("player2Status").textContent =
        "WAITING...";
    }

    if (
      data.player1?.choice &&
      data.player2?.choice
    ) {

      resolveRound(data);

    } else {

      resolving = false;

      document.getElementById("message").textContent =
        "WAITING FOR PLAYERS";

      document.getElementById("gameStatus").textContent =
        "Waiting for both players to lock their moves.";
    }
  }
});

document
.getElementById("nextRoundButton")
.addEventListener("click", async () => {

  resolving = false;

  await update(ref(db, "game"), {

    round:
      currentRound + 1,

    "player1/choice":
      null,

    "player2/choice":
      null,

    roundComplete:
      false

  });

});

document
.getElementById("newGameButton")
.addEventListener("click", async () => {

  resolving = false;

  await set(gameRef, {

    round: 1,

    player1: {
      choice: null
    },

    player2: {
      choice: null
    },

    score: {
      player1: 0,
      player2: 0
    },

    roundComplete: false

  });

});

</script>

</body>
</html>
